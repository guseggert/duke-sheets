name: Release

run-name: "Release: node=${{ inputs.node }}, python=${{ inputs.python }}, wasm=${{ inputs.wasm }}${{ inputs.dry_run && ' (dry run)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      node:
        description: "Node.js (@dukelib/sheets)"
        type: choice
        options: [patch, minor, major, skip]
        default: patch
      python:
        description: "Python (duke-sheets)"
        type: choice
        options: [patch, minor, major, skip]
        default: patch
      wasm:
        description: "WASM (@dukelib/sheets-wasm)"
        type: choice
        options: [patch, minor, major, skip]
        default: patch
      dry_run:
        description: "Dry run: bump and commit locally, but do not push or publish"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Tool versions pinned in mise.toml, matching local dev. Only the
      # tools this job needs; dotnet and wasm-pack are skipped.
      - uses: jdx/mise-action@v4
        with:
          install_args: node uv rust

      - name: Compute versions
        id: versions
        env:
          INPUT_NODE: ${{ inputs.node }}
          INPUT_PYTHON: ${{ inputs.python }}
          INPUT_WASM: ${{ inputs.wasm }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases must be run from main (got $GITHUB_REF)"
            exit 1
          fi

          bump() {
            local ver=$1 kind=$2 major minor patch
            IFS=. read -r major minor patch <<< "$ver"
            case "$kind" in
              major) echo "$((major + 1)).0.0" ;;
              minor) echo "${major}.$((minor + 1)).0" ;;
              patch) echo "${major}.${minor}.$((patch + 1))" ;;
            esac
          }

          tags=()

          if [[ "$INPUT_NODE" != "skip" ]]; then
            cur=$(node -p "require('./bindings/nodejs/package.json').version")
            new=$(bump "$cur" "$INPUT_NODE")
            echo "node: $cur -> $new"
            { echo "node_cur=$cur"; echo "node_new=$new"; } >> "$GITHUB_OUTPUT"
            tags+=("node-v$new")
          fi

          if [[ "$INPUT_PYTHON" != "skip" ]]; then
            cur=$(grep -m1 '^version = ' bindings/python/pyproject.toml | cut -d'"' -f2)
            cur_cargo=$(grep -m1 '^version = ' bindings/python/Cargo.toml | cut -d'"' -f2)
            if [[ "$cur" != "$cur_cargo" ]]; then
              echo "::error::bindings/python pyproject.toml ($cur) and Cargo.toml ($cur_cargo) versions disagree"
              exit 1
            fi
            new=$(bump "$cur" "$INPUT_PYTHON")
            echo "python: $cur -> $new"
            { echo "python_cur=$cur"; echo "python_new=$new"; } >> "$GITHUB_OUTPUT"
            tags+=("python-v$new")
          fi

          if [[ "$INPUT_WASM" != "skip" ]]; then
            cur=$(grep -m1 '^version = ' bindings/wasm/Cargo.toml | cut -d'"' -f2)
            new=$(bump "$cur" "$INPUT_WASM")
            echo "wasm: $cur -> $new"
            { echo "wasm_cur=$cur"; echo "wasm_new=$new"; } >> "$GITHUB_OUTPUT"
            tags+=("wasm-v$new")
          fi

          if [[ ${#tags[@]} -eq 0 ]]; then
            echo "::error::Nothing to release: all bindings set to skip"
            exit 1
          fi

          for tag in "${tags[@]}"; do
            if git ls-remote --exit-code origin "refs/tags/$tag" > /dev/null; then
              echo "::error::Tag $tag already exists"
              exit 1
            fi
          done

          echo "tags=${tags[*]}" >> "$GITHUB_OUTPUT"

      - name: Bump Node.js
        if: inputs.node != 'skip'
        working-directory: bindings/nodejs
        env:
          CUR: ${{ steps.versions.outputs.node_cur }}
          NEW: ${{ steps.versions.outputs.node_new }}
        run: |
          set -euo pipefail
          npm ci
          npm version "$NEW" --no-git-tag-version
          npx napi version

          # index.js is generated by napi build with the package version
          # stamped into its platform-package checks; restamp it in place
          # instead of running a full native build.
          stray=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' index.js | grep -vxF "$CUR" | sort -u || true)
          if [[ -n "$stray" ]]; then
            echo "::error::index.js contains unexpected version strings: $stray"
            exit 1
          fi
          count=$(grep -cF "$CUR" index.js)
          sed -i "s/${CUR//./\\.}/$NEW/g" index.js
          if grep -qF "$CUR" index.js || [[ $(grep -cF "$NEW" index.js) -ne $count ]]; then
            echo "::error::Failed to restamp index.js from $CUR to $NEW"
            exit 1
          fi
          echo "Restamped $count occurrences in index.js"

      - name: Bump Python
        if: inputs.python != 'skip'
        env:
          NEW: ${{ steps.versions.outputs.python_new }}
        run: |
          set -euo pipefail
          sed -i "s/^version = \"[^\"]*\"/version = \"$NEW\"/" \
            bindings/python/Cargo.toml bindings/python/pyproject.toml
          cargo update --workspace --manifest-path bindings/python/Cargo.toml
          uv lock --project bindings/python

      - name: Bump WASM
        if: inputs.wasm != 'skip'
        env:
          NEW: ${{ steps.versions.outputs.wasm_new }}
        run: |
          set -euo pipefail
          sed -i "s/^version = \"[^\"]*\"/version = \"$NEW\"/" bindings/wasm/Cargo.toml
          cargo update --workspace --manifest-path bindings/wasm/Cargo.toml

      - name: Commit and tag
        env:
          NODE_NEW: ${{ steps.versions.outputs.node_new }}
          PYTHON_NEW: ${{ steps.versions.outputs.python_new }}
          WASM_NEW: ${{ steps.versions.outputs.wasm_new }}
          TAGS: ${{ steps.versions.outputs.tags }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          parts=()
          if [[ -n "$NODE_NEW" ]]; then
            git add bindings/nodejs/package.json bindings/nodejs/package-lock.json \
              bindings/nodejs/index.js bindings/nodejs/npm/*/package.json
            parts+=("node $NODE_NEW")
          fi
          if [[ -n "$PYTHON_NEW" ]]; then
            git add bindings/python/Cargo.toml bindings/python/pyproject.toml \
              bindings/python/Cargo.lock bindings/python/uv.lock
            parts+=("python $PYTHON_NEW")
          fi
          if [[ -n "$WASM_NEW" ]]; then
            git add bindings/wasm/Cargo.toml bindings/wasm/Cargo.lock
            parts+=("wasm $WASM_NEW")
          fi

          if ! git diff --quiet; then
            echo "::error::Unstaged changes remain after staging release files:"
            git diff --stat
            exit 1
          fi

          msg="release:"
          sep=" "
          for part in "${parts[@]}"; do
            msg+="$sep$part"
            sep=", "
          done

          git commit -m "$msg"
          read -ra tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            git tag "$tag"
          done
          git show --stat HEAD

      - name: Push
        if: ${{ !inputs.dry_run }}
        env:
          TAGS: ${{ steps.versions.outputs.tags }}
        run: |
          set -euo pipefail
          read -ra tags <<< "$TAGS"
          refs=()
          for tag in "${tags[@]}"; do
            refs+=("refs/tags/$tag")
          done
          git push --atomic origin main "${refs[@]}"

      - name: Trigger publish workflows
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_NEW: ${{ steps.versions.outputs.node_new }}
          PYTHON_NEW: ${{ steps.versions.outputs.python_new }}
          WASM_NEW: ${{ steps.versions.outputs.wasm_new }}
        run: |
          set -euo pipefail
          # Tags pushed with GITHUB_TOKEN do not trigger tag workflows, so
          # dispatch them on the tag refs; github.ref then matches the
          # refs/tags/* conditions in their release jobs.
          if [[ -n "$NODE_NEW" ]]; then
            gh workflow run nodejs.yml --ref "node-v$NODE_NEW"
          fi
          if [[ -n "$PYTHON_NEW" ]]; then
            gh workflow run python.yml --ref "python-v$PYTHON_NEW"
          fi
          if [[ -n "$WASM_NEW" ]]; then
            gh workflow run wasm.yml --ref "wasm-v$WASM_NEW"
          fi

      - name: Summary
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          NODE_CUR: ${{ steps.versions.outputs.node_cur }}
          NODE_NEW: ${{ steps.versions.outputs.node_new }}
          PYTHON_CUR: ${{ steps.versions.outputs.python_cur }}
          PYTHON_NEW: ${{ steps.versions.outputs.python_new }}
          WASM_CUR: ${{ steps.versions.outputs.wasm_cur }}
          WASM_NEW: ${{ steps.versions.outputs.wasm_new }}
        run: |
          set -euo pipefail
          {
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "## Release (dry run - nothing pushed)"
            else
              echo "## Release"
            fi
            echo ""
            if [[ -n "$NODE_NEW" ]]; then
              echo "- node: $NODE_CUR -> $NODE_NEW ([nodejs.yml runs]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/nodejs.yml))"
            fi
            if [[ -n "$PYTHON_NEW" ]]; then
              echo "- python: $PYTHON_CUR -> $PYTHON_NEW ([python.yml runs]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/python.yml))"
            fi
            if [[ -n "$WASM_NEW" ]]; then
              echo "- wasm: $WASM_CUR -> $WASM_NEW ([wasm.yml runs]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/wasm.yml))"
            fi
            echo ""
            echo '```'
            git show --stat HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
