name: Python Bindings

on:
  push:
    tags:
      - 'python-v*'
  pull_request:
    paths:
      - 'bindings/python/**'
      - 'crates/**'
      - '.github/workflows/python.yml'
  workflow_dispatch:

env:
  WORKING_DIR: bindings/python

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64
            manylinux: '2_17'
          - host: ubuntu-latest
            target: aarch64
            manylinux: '2_17'
          - host: macos-13
            target: x86_64
          - host: macos-latest
            target: aarch64
          - host: windows-latest
            target: x86_64

    name: Build - ${{ matrix.settings.target }} (${{ matrix.settings.host }})
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.settings.target }}
          manylinux: ${{ matrix.settings.manylinux || 'auto' }}
          args: >-
            --release
            --strip
            --out dist
            --manifest-path bindings/python/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.settings.host }}-${{ matrix.settings.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >-
            --out dist
            --manifest-path bindings/python/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test:
    name: Test - ${{ matrix.os }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: ubuntu-latest
            target: x86_64
          - os: macos-latest
            host: macos-latest
            target: aarch64
          - os: windows-latest
            host: windows-latest
            target: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.host }}-${{ matrix.target }}
          path: dist

      - name: Install wheel and test dependencies
        run: |
          pip install pytest
          pip install --find-links dist --no-index duke-sheets

      - name: Run tests
        run: pytest bindings/python/tests/ -v

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/python-v')
    needs: [test, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
