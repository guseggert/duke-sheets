name: Node.js Bindings

on:
  push:
    tags:
      - 'node-v*'
  pull_request:
    paths:
      - 'bindings/nodejs/**'
      - 'crates/**'
      - '.github/workflows/nodejs.yml'
  workflow_dispatch:

env:
  WORKING_DIR: bindings/nodejs

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npx napi build --platform --release --js index.js --dts index.d.ts --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: npx napi build --platform --release --js index.js --dts index.d.ts --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: macos-latest
            target: x86_64-apple-darwin
            build: npx napi build --platform --release --js index.js --dts index.d.ts --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npx napi build --platform --release --js index.js --dts index.d.ts --target aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: npx napi build --platform --release --js index.js --dts index.d.ts --target x86_64-pc-windows-msvc

    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            bindings/nodejs/target/
          key: ${{ matrix.settings.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.settings.target }}-cargo-

      - run: npm install

      - run: ${{ matrix.settings.build }}
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ env.WORKING_DIR }}/duke-sheets.*.node
          if-no-files-found: error

  test:
    name: Test - ${{ matrix.os }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: ${{ env.WORKING_DIR }}

      - run: npm test

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/node-v')
    needs: [test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npx napi create-npm-dirs

      - uses: actions/download-artifact@v4
        with:
          path: ${{ env.WORKING_DIR }}/artifacts

      - name: Move artifacts into platform packages
        run: npx napi artifacts

      - name: List packages
        run: |
          ls -lR npm/
          echo "---"
          cat package.json | grep -A 20 optionalDependencies || true

      - name: Create tarballs
        run: |
          # Pack each platform package
          for dir in npm/*/; do
            (cd "$dir" && npm pack)
          done
          # Pack root package
          npm pack

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bindings/nodejs/*.tgz
            bindings/nodejs/npm/*/*.tgz
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
