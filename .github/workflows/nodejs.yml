name: Node.js Bindings

on:
  push:
    tags:
      - 'node-v*'
  pull_request:
    paths:
      - 'bindings/nodejs/**'
      - 'tools/*python*trust.py'
      - 'crates/**'
      - '.github/workflows/nodejs.yml'
  workflow_dispatch:

env:
  WORKING_DIR: bindings/nodejs

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npx napi build --platform --release --js index.js --dts generated.d.ts --no-const-enum --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: npx napi build --platform --release --js index.js --dts generated.d.ts --no-const-enum --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: npx napi build --platform --release --js index.js --dts generated.d.ts --no-const-enum --target x86_64-unknown-linux-musl -x
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: npx napi build --platform --release --js index.js --dts generated.d.ts --no-const-enum --target aarch64-unknown-linux-musl -x
          - host: macos-latest
            target: x86_64-apple-darwin
            build: npx napi build --platform --release --js index.js --dts generated.d.ts --no-const-enum --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npx napi build --platform --release --js index.js --dts generated.d.ts --no-const-enum --target aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: npx napi build --platform --release --js index.js --dts generated.d.ts --no-const-enum --target x86_64-pc-windows-msvc

    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.4'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.settings.target }}

      - name: Install Zig with verified Python installer trust
        if: ${{ contains(matrix.settings.target, 'musl') }}
        shell: bash
        run: |
          python3 -m venv --without-pip "$RUNNER_TEMP/zig-python"
          "$RUNNER_TEMP/zig-python/bin/python" ../../tools/upgrade-python-trust.py
          "$RUNNER_TEMP/zig-python/bin/python" -m pip install --use-deprecated=legacy-certs ziglang==0.14.1
          "$RUNNER_TEMP/zig-python/bin/python" -c 'import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).parent)' >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        with:
          tool: cargo-zigbuild

      - run: npm install

      - run: ${{ matrix.settings.build }}
        shell: bash
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ env.WORKING_DIR }}/duke-sheets.*.node
          if-no-files-found: error

  test:
    name: Test - ${{ matrix.os }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.4'

      - run: npm install

      - uses: actions/download-artifact@v8.0.2
        with:
          name: bindings-${{ matrix.target }}
          path: ${{ env.WORKING_DIR }}

      - run: npm test

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/node-v')
    needs: [test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org
      - run: npm install

      - run: npx napi create-npm-dirs

      - uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ env.WORKING_DIR }}/artifacts

      - name: Move artifacts into platform packages
        run: npx napi artifacts

      - name: Prepare npm packages
        run: npx napi pre-publish --no-gh-release --skip-optional-publish

      - name: List packages
        run: |
          ls -lR npm/
          echo "---"
          cat package.json | grep -A 20 optionalDependencies || true

      - name: Create tarballs
        run: |
          # Pack each platform package
          for dir in npm/*/; do
            (cd "$dir" && npm pack)
          done
          # Pack root package
          npm pack

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            bindings/nodejs/*.tgz
            bindings/nodejs/npm/*/*.tgz
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true

      - name: Publish to npm
        run: |
          for dir in npm/*/; do
            (cd "$dir" && npm publish --access public) || true
          done
          npm publish --access public
