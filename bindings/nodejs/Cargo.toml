[package]
name = "duke-sheets-nodejs"
version = "0.1.0"
edition = "2021"
description = "Node.js/TypeScript bindings for duke-sheets - high-performance Excel library"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
duke-sheets = { path = "../../crates/duke-sheets", features = ["full"] }
duke-sheets-core = { path = "../../crates/duke-sheets-core" }
duke-sheets-xlsx = { path = "../../crates/duke-sheets-xlsx" }
duke-sheets-csv = { path = "../../crates/duke-sheets-csv" }
napi = { version = "3", default-features = false, features = ["napi9"] }
napi-derive = { version = "3", features = ["type-def"] }

[build-dependencies]
napi-build = "2"

[features]
default = []
