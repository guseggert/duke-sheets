[package]
name = "duke-sheets-wasm"
version = "0.1.14"
edition = "2021"
description = "WebAssembly bindings for duke-sheets - high-performance Excel library"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
duke-sheets = { path = "../../crates/duke-sheets", features = ["full"] }
duke-sheets-core = { path = "../../crates/duke-sheets-core" }
duke-sheets-csv = { path = "../../crates/duke-sheets-csv" }
duke-sheets-xlsx = { path = "../../crates/duke-sheets-xlsx" }
duke-sheets-xlsb = { path = "../../crates/duke-sheets-xlsb" }
duke-sheets-chart = { path = "../../crates/duke-sheets-chart" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# For WASM random number generation
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
# Enable chrono's wasmbind feature so Local::now()/Utc::now() use js_sys::Date
# instead of SystemTime::now() (which panics on wasm32-unknown-unknown).
# This makes NOW() and TODAY() formulas work in WASM.
chrono = { version = "0.4", default-features = false, features = ["wasmbind"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]
