[package]
name = "duke-sheets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A Rust library for reading, writing, and manipulating spreadsheets (Excel, CSV)"
keywords = ["excel", "xlsx", "xls", "spreadsheet", "csv"]
categories = ["parser-implementations", "encoding"]

[dependencies]
duke-sheets-core.workspace = true
duke-sheets-formula.workspace = true
duke-sheets-xlsx.workspace = true
duke-sheets-xls = { workspace = true, optional = true }
duke-sheets-csv.workspace = true
duke-sheets-chart.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
pretty_assertions.workspace = true
zip.workspace = true
criterion.workspace = true
calamine = "0.26"
umya-spreadsheet = "2.3"
rust_xlsxwriter = "0.82"

[features]
default = ["xlsx", "csv"]
xlsx = []
xls = ["dep:duke-sheets-xls"]
csv = []
full = ["xlsx", "xls", "csv"]

[[bench]]
name = "xlsx_read"
harness = false

[[bench]]
name = "xlsx_write"
harness = false


[[bench]]
name = "csv_roundtrip"
harness = false

[[bench]]
name = "formula_parser"
harness = false

[[bench]]
name = "calculation"
harness = false
