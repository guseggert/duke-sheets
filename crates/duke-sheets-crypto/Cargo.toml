[package]
name = "duke-sheets-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Office document encryption/decryption for duke-sheets (XLS + OOXML)"

[dependencies]
thiserror.workspace = true
log.workspace = true

# Crypto primitives (all pure Rust, from RustCrypto). All WASM-friendly.
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
rc4 = "0.2"
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
cipher = "0.4"
subtle = "2"

# OOXML Agile EncryptionInfo is an XML descriptor; quick-xml is already
# in the workspace.
quick-xml.workspace = true

# Random byte generation for salts / IVs / keys. WASM consumers must
# enable getrandom's `js` feature in their own Cargo.toml; bindings/wasm
# already does so via its top-level dependency.
getrandom = "0.2"

[dev-dependencies]
pretty_assertions.workspace = true
# Round-trip tests build sample inner ZIPs and use the in-house CFB
# reader to parse the envelope assembled by tests.
zip.workspace = true
duke-sheets-xls = { path = "../duke-sheets-xls" }
# Used by the fixture generator test to produce encrypted Office files via
# LibreOffice's storeToURL. The fixture-gen test is #[ignore]-gated so CI
# doesn't need a running LibreOffice unless someone is explicitly
# regenerating fixtures.
duke-sheets-libreoffice = { path = "../duke-sheets-libreoffice" }
libreoffice-urp = { path = "../libreoffice-urp" }
tokio = { version = "1", features = ["rt", "sync", "net", "macros"] }
