[package]
name = "duke-sheets-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Office document encryption/decryption for duke-sheets (XLS + OOXML)"

[dependencies]
thiserror.workspace = true
log.workspace = true

# Crypto primitives (all pure Rust, from RustCrypto).
sha1 = "0.10"
md-5 = "0.10"
rc4 = "0.2"
subtle = "2"

[dev-dependencies]
pretty_assertions.workspace = true
# Used by the fixture generator test to produce encrypted Office files via
# LibreOffice's storeToURL. The fixture-gen test is #[ignore]-gated so CI
# doesn't need a running LibreOffice unless someone is explicitly
# regenerating fixtures.
duke-sheets-libreoffice = { path = "../duke-sheets-libreoffice" }
libreoffice-urp = { path = "../libreoffice-urp" }
tokio = { version = "1", features = ["rt", "sync", "net", "macros"] }
